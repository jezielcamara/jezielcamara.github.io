<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jeziel Camara | Full-Stack Web Developer</title>

  <meta
    name="description"
    content="Portfolio of Jeziel Camara, a frontend and backend web developer based in the Philippines."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #f5f5f5;
      background: #0d1117;
    }

    main {
      width: min(900px, 90%);
      min-height: 100vh;
      margin: auto;
      display: flex;
      align-items: center;
    }

    .hero {
      max-width: 700px;
    }

    .label {
      color: #8b949e;
      font-size: 1rem;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 1;
    }

    p {
      max-width: 600px;
      color: #b1bac4;
      font-size: 1.15rem;
      line-height: 1.7;
    }

    .links {
      display: flex;
      gap: 12px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    a {
      display: inline-block;
      padding: 12px 20px;
      color: #ffffff;
      text-decoration: none;
      border: 1px solid #30363d;
      border-radius: 8px;
    }

    .primary {
      color: #0d1117;
      background: #ffffff;
    }
  </style>
</head>

<body>
  <main>
    <section class="hero">
      <div class="label">Frontend and Backend Web Developer</div>

      <h1>Hi, I'm Jeziel Camara.</h1>

      <p>
        I design and build responsive websites and web applications for
        businesses, from the user interface to the backend.
      </p>

      <div class="links">
        <a class="primary" href="mailto:camarajeziel@gmail.com">
          Contact Me
        </a>

        <a href="https://github.com/jezielcamara">
          View GitHub
        </a>
      </div>
    </section>
  </main>
</body>
</html>
